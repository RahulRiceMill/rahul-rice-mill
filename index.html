<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d2b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Rahul Rice Mill Premium Pro</title>
<style>
:root{--g0:#062b1f;--g1:#0b3d2b;--g2:#10b981;--gold:#d4af37;--bg:#f4f7f4;--ink:#12251c;--mut:#5b6b62;--card:#fff;--ln:#dbe5de}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font:16px/1.45 Georgia,'Noto Serif Devanagari',serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
h1,h2,h3,button,label,th,.nav{font-family:system-ui,'Noto Sans Devanagari',sans-serif}
header{background:linear-gradient(135deg,var(--g0),var(--g1));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
header .lg{height:44px;max-width:96px;border-radius:8px;background:#fff;object-fit:contain;flex:none;padding:2px}
header b{flex:1;font:600 1.05rem system-ui;line-height:1.1}header small{display:block;font-weight:400;color:#bfe3d0;font-size:.72rem}
.lang{background:var(--gold);color:var(--g0);border:0;border-radius:20px;padding:8px 14px;font-weight:700;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--g0),var(--g1));color:#fff;border-radius:20px;padding:18px;text-align:center;margin-bottom:14px;border:1px solid var(--gold)}
.hero img{max-height:110px;max-width:80%;background:#fff;border-radius:12px;padding:6px}.hero h2{margin:8px 0 2px;font-size:1.5rem}.hero p{margin:2px;color:#cfeadb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--gold);border-radius:14px;padding:12px}
.stat small{color:var(--mut);font-family:system-ui}.stat div{font:700 1.2rem system-ui;color:var(--g1);word-break:break-word}
.btn{border:0;border-radius:12px;padding:13px 16px;font:600 1rem system-ui;cursor:pointer;background:var(--g1);color:#fff;min-height:48px}
.btn.g{background:var(--gold);color:var(--g0)}.btn.o{background:#fff;color:var(--g1);border:2px solid var(--g1)}.btn.r{background:#b3261e}
.btn:active{transform:scale(.97)}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:1rem system-ui;background:#fff;min-height:46px}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--g1);font-size:.8rem}
.tw{overflow-x:auto;max-width:100%}.n{text-align:right;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--g1);background:#fff;font-weight:600}.tabs .on{background:var(--g1);color:#fff}
.warn{background:#fff7dc;border:1px solid var(--gold);border-radius:12px;padding:10px;margin-bottom:12px;font-family:system-ui;font-size:.9rem}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font:600 .75rem system-ui;background:#dff5e8;color:#0b6b45}.tag.x{background:#fde4e2;color:#b3261e}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.gal div{position:relative}.gal img{width:100%;height:100px;object-fit:cover;border-radius:10px}.gal button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:28px;height:28px;background:#b3261e;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--g0);display:flex;padding-bottom:env(safe-area-inset-bottom);border-top:2px solid var(--gold);z-index:6}
.nav button{flex:1;background:none;border:0;color:#a9d3bf;padding:9px 2px;font-size:.68rem;cursor:pointer}.nav button span{display:block;font-size:1.3rem}.nav .on{color:var(--gold)}
#mod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;padding:14px}
#mod .box{background:#fff;max-width:760px;margin:0 auto;border-radius:14px;padding:16px}#mod .bar{display:flex;gap:8px;margin-bottom:12px}
.rc{font:14px/1.4 system-ui,'Noto Sans Devanagari',sans-serif;color:#000}.rc .h{text-align:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}.rc .h img{max-height:80px;max-width:60%}.rc .h h2{margin:4px 0 0}.rc .t td,.rc .t th{border-bottom:1px dashed #888}.rc .tot{text-align:right;margin-top:8px}.rc .ty{text-align:center;margin-top:14px;font-weight:600}
@media print{@page{margin:8mm}body>*:not(#mod){display:none!important}#mod{display:block;position:static;background:none;padding:0}#mod .box{box-shadow:none;padding:0;max-width:none}.bar{display:none!important}body{padding:0}body.p80 #mod .box{width:72mm;font-size:11px}}
@media(prefers-reduced-motion:no-preference){main>*{animation:f .25s}@keyframes f{from{opacity:.4}}}
</style></head><body>
<header><img class="lg" id="hl" alt=""><b id="ht"></b><button class="lang" id="lb" onclick="tl()"></button></header>
<main id="v"></main>
<nav class="nav" id="nv"></nav>
<div id="mod"><div class="box"><div class="bar"><button class="btn" onclick="window.print()" id="mp"></button><button class="btn o" onclick="cm()" id="mc"></button></div><div id="mb" class="rc"></div></div></div>

<h3>${t('bd')}</h3><table class="t"><tr><th>${DB.tab=='d'?t('billNo'):bl}</th><th>${DB.tab=='d'?t('cust'):''}</th><th class="n">${DB.tab=='d'?'kg':''}</th><th class="n">${t('amount')}</th></tr>${rows||`<tr><td colspan=4>${t('empty')}</td></tr>`}</table></div>`}
function dash(){const x=DB.tab,inp=x=='d'?`<input type="date" value="${DB.d}" onchange="DB.d=this.value;R()">`:x=='m'?`<input type="month" value="${DB.m}" onchange="DB.m=this.value;R()">`:`<input type="number" min="2000" max="2200" value="${DB.y}" onchange="DB.y=this.value;R()">`;
return `<div class="tabs">${[['d','daily'],['m','monthly'],['y','yearly']].map(([k,n])=>`<button class="${x==k?'on':''}" onclick="DB.tab='${k}';R()">${t(n)}</button>`).join('')}</div>
<div class="card">${inp}<button class="btn g" style="margin-top:10px;width:100%" onclick="show(repH())">${t('ver')}</button></div><div class="card">${repH()}</div>`}
/* HISTORY */
function hist(){let l=[...S.bills].reverse();const q=HF.q.toLowerCase();
l=l.filter(b=>(!q||b.no.toLowerCase().includes(q)||b.name.toLowerCase().includes(q)||b.key.includes(q))&&(!HF.m||b.key.slice(5,7)==HF.m)&&(!HF.y||b.key.slice(0,4)==HF.y));
const ys=[...new Set(S.bills.map(b=>b.key.slice(0,4)))];
return `<div class="card"><input id="hq" placeholder="${t('search')}" value="${esc(HF.q)}" oninput="HF.q=this.value;hl()"><div class="row"><div><label>${t('month')}</label><select onchange="HF.m=this.value;R()"><option value="">${t('all')}</option>${[...Array(12)].map((_,i)=>{const m=String(i+1).padStart(2,'0');return`<option ${HF.m==m?'selected':''}>${m}</option>`}).join('')}</select></div><div><label>${t('year')}</label><select onchange="HF.y=this.value;R()"><option value="">${t('all')}</option>${ys.map(y=>`<option ${HF.y==y?'selected':''}>${y}</option>`).join('')}</select></div></div>
<button class="btn o" style="margin-top:10px;width:100%" onclick="csv()">${t('csv')}</button></div><div class="card" id="hl2">${hb(l)}</div>`}
function hb(l){return `<div class="tw"><table><tr><th>${t('billNo')}</th><th>${t('cust')}</th><th>${t('date')}</th><th>${t('items')}</th><th class="n">kg</th><th class="n">${t('total')}</th><th></th></tr>${l.map(b=>`<tr><td>${b.no}<br><span class="tag ${b.status=='cancelled'?'x':''}">${b.status=='cancelled'?t('cancelled'):t('done')}</span></td><td>${esc(b.name)}</td><td>${b.key}</td><td>${[...new Set(b.items.map(i=>sn(i.sid)))].join(', ')}</td><td class="n">${b.tw}</td><td class="n">${$m(b.grand)}</td><td><button class="btn o" onclick="rc('${b.id}')">${t('view')}</button>${b.status=='completed'?` <button class="btn r" onclick="cx('${b.id}')">✕</button>`:''}</td></tr>`).join('')||`<tr><td colspan=7>${t('empty')}</td></tr>`}</table></div>`}
function hl(){let l=[...S.bills].reverse();const q=HF.q.toLowerCase();l=l.filter(b=>(!q||b.no.toLowerCase().includes(q)||b.name.toLowerCase().includes(q)||b.key.includes(q))&&(!HF.m||b.key.slice(5,7)==HF.m)&&(!HF.y||b.key.slice(0,4)==HF.y));$('#hl2').innerHTML=hb(l)}
function cx(id){const b=S.bills.find(x=>x.id==id);if(!confirm(t('cfCancel')))return;const r=prompt(t('reason'));if(!r||!r.trim())return;b.status='cancelled';b.cancelReason=r.trim();b.cancelAt=new Date().toISOString();S.audit.push({at:b.cancelAt,act:'cancel',no:b.no,reason:b.cancelReason});sv();R()}
/* RATES */
function svc(){return `<div class="card"><p>${t('eff')}: <b>${S.set.rateDate} B.S.</b></p><div class="tw"><table><tr><th>#</th><th>${t('service')}</th><th class="n">${t('rate')}</th></tr>${SV.map((s,i)=>`<tr><td>${i+1}</td><td>${s[L()]}</td><td class="n"><b>${S.set.cur} ${S.rates[s.id]}</b><br><small>${s.u=='q'?t('qtl'):t('kg')}</small></td></tr>`).join('')}</table></div></div><button class="btn g" style="width:100%" onclick="go('bill')">+ ${t('newBill')}</button>`}
/* SETTINGS */
function set(){return `<div class="card"><h3>${t('bname')} / ${t('baddr')}</h3><label>${t('bname')}</label><input id="sn" value="${esc(S.set.name)}"><label>${t('baddr')}</label><input id="sa2" value="${esc(S.set.addr)}"><div class="row"><div><label>${t('cur')}</label><input id="sc" value="${esc(S.set.cur)}"></div><div><label>${t('lang')}</label><select id="sl"><option value="en" ${L()=='en'?'selected':''}>English</option><option value="ne" ${L()=='ne'?'selected':''}>नेपाली</option></select></div><div><label>${t('paper')}</label><select id="sp"><option value="a4" ${S.set.paper=='a4'?'selected':''}>A4</option><option value="80" ${S.set.paper=='80'?'selected':''}>80 mm</option></select></div></div><button class="btn g" style="margin-top:10px;width:100%" onclick="sb()">${t('save')}</button></div>
<div class="card"><h3>${t('logo')}</h3><div id="lp"><img src="${LG()}" style="max-height:90px;max-width:100%" alt=""></div><input type="file" accept="image/png,image/jpeg,image/webp" onchange="pl(this)" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="btn g" onclick="slg()">${t('save')}</button><button class="btn r" onclick="rl()">${t('remove')}</button></div></div>
<div class="card"><h3>${t('gallery')}</h3><div class="gal">${S.gal.map((g,i)=>`<div><img src="${g}" alt=""><button onclick="dg(${i})">✕</button></div>`).join('')}</div><input type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="ag(this)" style="margin-top:8px"></div>
<div class="card"><h3>${t('svcRates')}</h3><label>${t('eff')} (B.S.)</label><input id="rd" value="${S.set.rateDate}">${SV.map(s=>`<label>${s[L()]} — ${s.u=='q'?t('qtl'):t('kg')}</label><input class="ri" data-id="${s.id}" type="number" step="any" min="0" value="${S.rates[s.id]}">`).join('')}<button class="btn g" style="margin-top:10px;width:100%" onclick="sr2()">${t('save')}</button></div>
<div class="card"><button class="btn" style="width:100%;margin-bottom:8px" onclick="bk()">${t('backup')}</button><label>${t('restore')}</label><input type="file" accept=".json" onchange="rs(this)"><button class="btn r" style="width:100%;margin-top:10px" onclick="cd()">${t('clearDraft')}</button><p class="warn" style="margin-top:12px">${t('store')}</p></div>`}
function sb(){S.set.name=$('#sn').value.trim()||'Rahul Rice Mill';S.set.addr=$('#sa2').value.trim();S.set.cur=$('#sc').value.trim()||'Rs.';S.set.lang=$('#sl').value;S.set.paper=$('#sp').value;sv();R();alert(t('saved'))}
function sr2(){const ch=[...document.querySelectorAll('.ri')].filter(i=>+i.value!=S.rates[i.dataset.id]&&+i.value>=0&&i.value!=='');const rd=$('#rd').value.trim();if(!ch.length&&rd==S.set.rateDate)return;if(!confirm(t('cfRate')+'\n'+ch.map(i=>`${sn(i.dataset.id)}: ${S.rates[i.dataset.id]} → ${i.value}`).join('\n')))return;ch.forEach(i=>{S.audit.push({at:new Date().toISOString(),act:'rate',id:i.dataset.id,from:S.rates[i.dataset.id],to:+i.value});S.rates[i.dataset.id]=+i.value});S.set.rateDate=rd||S.set.rateDate;sv();R();alert(t('saved'))}
function rz(file,max,type,q){return new Promise((ok,no)=>{if(!/^image\/(png|jpeg|webp)$/.test(file.type))return no();const f=new FileReader();f.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(type,q))};im.onerror=no;im.src=f.result};f.readAsDataURL(file)})}
async function pl(i){try{tmpLogo=await rz(i.files[0],400,'image/webp',.85);$('#lp').innerHTML=`<img src="${tmpLogo}" style="max-height:90px;max-width:100%" alt=""> (${t('preview')})`}catch(e){}}
function slg(){if(!tmpLogo)return;S.logo=tmpLogo;tmpLogo=null;sv();R()}function rl(){S.logo='';tmpLogo=null;sv();R()}
async function ag(i){for(const f of i.files){try{if(S.gal.length>=12)break;S.gal.push(await rz(f,800,'image/jpeg',.7))}catch(e){}}sv();R()}function dg(x){S.gal.splice(x,1);sv();R()}
function dl(n,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=n;a.click()}
function bk(){S.set.lastBackup=Date.now();sv();dl(`rahul-rice-mill-backup-${npd(new Date())}.json`,JSON.stringify(S),'application/json');R()}
function csv(){const q=s=>`"${String(s).replace(/"/g,'""')}"`,h=['Bill No','Customer','Phone','Date','Time (NPT)','Services','Weight kg','Subtotal','Discount','Total','Status','Cancel reason'];
dl(`sales-${npd(new Date())}.csv`,'\ufeff'+[h.map(q).join(','),...S.bills.map(b=>[b.no,b.name,b.phone||'',b.key,npt(b.at),b.items.map(i=>`${SV.find(s=>s.id==i.sid).en} ${i.w}kg@${i.rate}`).join('; '),b.tw,b.sub,b.disc,b.grand,b.status,b.cancelReason||''].map(q).join(','))].join('\n'),'text/csv')}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.bills)||!x.rates||!x.set)throw 0;if(!confirm(t('cfRestore')))return;S=Object.assign(D(),x);S.set=Object.assign(D().set,x.set);sv();R()}catch(e){alert(t('badFile'))}};r.readAsText(f)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
R();
</script></body></html>
